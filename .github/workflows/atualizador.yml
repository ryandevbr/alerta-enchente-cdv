name: Atualizador de Dados CDV

on:
  # Cron a cada 15 minutos.
  # Roda o pipeline completo: ANA -> CEMIG -> Cache -> Alertas -> Monitor.
  # A ordem dos jobs é garantida pelos 'needs' de cada um.
  schedule:
    - cron: '0,15,30,45 * * * *'

  workflow_dispatch:
    inputs:
      pular_ana:
        description: 'Pular coleta da ANA'
        type: boolean
        default: false
      pular_cemig:
        description: 'Pular coleta da CEMIG'
        type: boolean
        default: false
      pular_cache:
        description: 'Pular recálculo de cache'
        type: boolean
        default: false

# Evita execucoes sobrepostas (uma nova espera a anterior terminar)
concurrency:
  group: atualizador-cdv
  cancel-in-progress: false

jobs:
  atualizar-ana:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || !inputs.pular_ana }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar atualizador ANA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANA_USER: ${{ secrets.ANA_USER }}
          ANA_PASS: ${{ secrets.ANA_PASS }}
        run: python atualizador_tempo_real.py

  coletar-cemig:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || !inputs.pular_cemig }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Rodar coletor CEMIG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python coletor_cemig.py

  atualizar-cache:
    needs: [atualizar-ana, coletar-cemig]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || !inputs.pular_cache) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar atualizador de cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador_cache_site.py

  enviar-alertas:
    needs: [atualizar-ana, coletar-cemig]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar alertas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas_qualitativos.py

  monitor-saude:
    needs: [atualizar-ana, coletar-cemig, atualizar-cache, enviar-alertas]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar monitor de saude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_saude.py