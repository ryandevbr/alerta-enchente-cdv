name: Atualizador de Dados CDV

on:
  schedule:
    # Coleta de dados normal (a cada 15 min)
    - cron: '0,15,30,45 * * * *'
    # Story automático: 00h, 06h, 12h e 18h (Horário de Brasília = UTC-3)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      pular_ana:
        description: 'Pular coleta da ANA'
        type: boolean
        default: false
      pular_cemig:
        description: 'Pular coleta da CEMIG'
        type: boolean
        default: false
      pular_cache:
        description: 'Pular recálculo de cache'
        type: boolean
        default: false
      tarefa:
        description: 'O que rodar?'
        required: false
        default: 'completo'
        type: choice
        options:
          - completo
          - story

concurrency:
  group: atualizador-cdv
  cancel-in-progress: false

jobs:
  atualizar-ana:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (inputs.tarefa != 'story' && !inputs.pular_ana) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar atualizador ANA (REST)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANA_USER: ${{ secrets.ANA_USER }}
          ANA_PASS: ${{ secrets.ANA_PASS }}
        run: python atualizador_tempo_real.py

  coletar-ana-xml:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (inputs.tarefa != 'story' && !inputs.pular_ana) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar coletor XML da ANA
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python coletor_ana_xml.py

  coletar-cemig:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (inputs.tarefa != 'story' && !inputs.pular_cemig) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Rodar coletor CEMIG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python coletor_cemig.py

  atualizar-cache:
    needs: [atualizar-ana, coletar-ana-xml, coletar-cemig]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (inputs.tarefa != 'story' && !inputs.pular_cache)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar atualizador de cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python atualizador_cache_site.py

  capturar-historico:
    needs: [atualizar-cache]
    runs-on: ubuntu-latest
    # Roda no agendamento automático ou quando você mandar rodar o "completo"
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.tarefa == 'completo') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: pip install -r requirements.txt
        
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Capturar Frame Histórico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python capturar_historico.py

  enviar-alertas:
    needs: [atualizar-ana, coletar-ana-xml, coletar-cemig]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.tarefa != 'story') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar alertas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: python alertas_qualitativos.py

  monitor-saude:
    needs: [atualizar-ana, coletar-ana-xml, coletar-cemig, atualizar-cache, enviar-alertas]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.tarefa != 'story') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Rodar monitor de saude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_saude.py

  gerar-story:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tarefa == 'story' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Instalar dependencias
        run: pip install -r requirements.txt
        
      - name: Gerar Story para Instagram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gerar_story.py